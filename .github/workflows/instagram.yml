name: Instagram Automation

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Operation"
        required: true
        type: choice
        options:
          - media
          - discover
          - discover_all
          - process

      media:
        description: "Media (required for discover; optional for process)"
        required: false
        type: choice
        options:
          - ""
          - dlf_midtown
          - dear_donna
          - dhan_mill
          - nukkad
          - china_club
          - nubo
          - guwahati_airport
          - woodzo
          - route65
          - panjab_house

      count:
        description: "Number of comments"
        required: false
        type: string

jobs:
  run:
    runs-on: [self-hosted, ARM64]

    steps:
      - name: Update code
        shell: bash
        run: |
          set -e
          cd /home/ubuntu/instagram-auto-reply
          git pull --ff-only origin main
      - name: Run Instagram automation
        shell: bash
        run: |
          set -e

          cd /home/ubuntu/instagram-auto-reply
          source .venv/bin/activate

          echo "Running command: ${{ inputs.command }}"
          echo "Media: ${{ inputs.media }}"
          echo "Count: ${{ inputs.count }}"

          case "${{ inputs.command }}" in

            media)
              python main.py media
              ;;

            discover)
              if [ -z "${{ inputs.media }}" ]; then
                echo "ERROR: Media is required for discover"
                exit 1
              fi

              python main.py discover \
                "${{ inputs.media }}" \
                "${{ inputs.count }}"
              ;;

            discover_all)
              python main.py discover_all \
                "${{ inputs.count }}"
              ;;

            process)
              if [ -z "${{ inputs.media }}" ]; then
                if [ -z "${{ inputs.count }}" ]; then
                  python main.py process
                else
                  python main.py process \
                    --count "${{ inputs.count }}"
                fi
              else
                if [ -z "${{ inputs.count }}" ]; then
                  python main.py process \
                    "${{ inputs.media }}"
                else
                  python main.py process \
                    "${{ inputs.media }}" \
                    --count "${{ inputs.count }}"
                fi
              fi
              ;;

            *)
              echo "ERROR: Unknown command"
              exit 1
              ;;

          esac
      - name: Show database status
        shell: bash
        run: |
          cd /home/ubuntu/instagram-auto-reply

          echo ""
          echo "========================================"
          echo "DATABASE STATUS"
          echo "========================================"

          sqlite3 instagram.db <<'SQL'
          SELECT 'Total queue rows: ' || COUNT(*) FROM queue;

          SELECT '';
          SELECT 'By media and status:';

          SELECT media_name || ' | ' || status || ' | ' || COUNT(*)
          FROM queue
          GROUP BY media_name, status
          ORDER BY media_name, status;

          SELECT '';
          SELECT 'Queue details:';

          SELECT
            comment_id || ' | ' ||
            comment || ' | ' ||
            media_name || ' | ' ||
            status || ' | ' ||
            created_at
          FROM queue
          ORDER BY comment_id;
          SQL

          echo "========================================"
